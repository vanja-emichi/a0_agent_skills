name: a0_agent_skills
title: Agent Skills
description: >-
  Production-grade engineering skills and workflow governance for Agent Zero.
  23 skills covering the full SDLC (spec, plan, build, test, review, ship),
  3 specialist agent profiles (code-reviewer, security-auditor, test-engineer),
  7 slash commands, telemetry logging, and declarative routing via system prompt
  extension. v1.0 adds: skill enforcement gate with utility-model classifier,
  durable workflow state (survives context compaction), 6-phase advisory
  governance model (DEFINE→PLAN→BUILD→VERIFY→REVIEW→SHIP), and skill contracts
  with YAML frontmatter and runtime DAG validation.
version: 1.0.0
author: Vanja Bunjevac
plugin_url: https://github.com/vanja-emichi/a0_agent_skills
settings_sections:
  - agent
per_project_config: true
per_agent_config: false
