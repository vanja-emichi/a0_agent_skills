# a0_agent_skills plugin configuration

# Telemetry — logs skills_tool activations to a JSONL file for validation
telemetry_enabled: true          # Enabled by default — set to false to disable
telemetry_log_path: .a0proj/skill_activations.jsonl  # Relative to project folder
telemetry_max_lines: 0          # 0 = unlimited; set e.g. 1000 to rotate automatically

# Enforcement gate — controls skill-enforcement behavior
enforcement_mode: observe           # observe (log only, no rewrites) or enforce (inject missing skill calls)
enforcement_classifier_model: null  # null = use utility model; set model name to override
enforcement_shadow_sample_rate: 0.0 # 0.0 = disabled; 1.0 = classify every call; 0.1 = 10% sample

# Durable workflow state — persists workflow context across compaction and session breaks
workflow_state_enabled: true        # Set to false to disable all state persistence and rehydration
workflow_state_path: .a0proj/state  # Relative to project folder; state files live here
max_progress_entries: 10000        # Max JSONL entries before rotation (0 = unlimited)

# Phase-aware governance — extends enforcement with phase context
phase_governance_enabled: true                    # Set to false to disable phase-aware enforcement
enforcement_correction_cooldown_seconds: 300      # Minimum seconds between corrections for the same candidate

# Skill contracts (Slice 4) — enriches enforcement with contract metadata
skill_contracts_enabled: true                      # Set to false to disable contract-aware enforcement (reverts to Slice 3)
skill_graph_validate_on_build: true                # Validate dependency graph for cycles on build
skill_next_skill_hints: true                       # Show next-skill recommendations in rehydrated state
